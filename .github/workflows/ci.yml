name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Conformance fixtures, CLI scenarios and repository linter
        run: zig build test
      - name: Release build and size budget
        shell: bash
        run: |
          zig build
          binary=$(ls zig-out/bin/rufix zig-out/bin/rufix.exe 2>/dev/null | head -1)
          size=$(wc -c < "$binary")
          echo "release binary: $size bytes"
          test "$size" -le 307200
          "$binary" version
