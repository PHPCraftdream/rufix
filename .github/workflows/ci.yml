name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Conformance fixtures, CLI scenarios and repository linter
        run: zig build test
      - name: Release build and size budget
        shell: bash
        run: |
          zig build
          binary=zig-out/bin/rufix
          if [ -f zig-out/bin/rufix.exe ]; then binary=zig-out/bin/rufix.exe; fi
          size=$(wc -c < "$binary" | tr -d ' ')
          echo "release binary: $size bytes"
          test "$size" -le 307200
          "$binary" version
      - name: Installer smoke test (install.sh, then a scratch repository)
        shell: bash
        run: bash .github/smoke.sh
      - name: Installer smoke test (install.ps1 and install.cmd)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/smoke.ps1
